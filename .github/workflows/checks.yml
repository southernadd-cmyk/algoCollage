name: Prototype checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify the collage pipeline
        run: npm test
      - name: Check JavaScript syntax
        run: |
          for file in js/*.js vendor/algoart/*.js; do
            node --check "$file"
          done
